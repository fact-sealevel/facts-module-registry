# EMULANDICE2 glaciers  MODULE CONFIGURATION
# This YAML file describes the arguments and configuration needed to run the module.
# It is used to generate ModuleSchema objects.
# Based on https://github.com/fact-sealevel/emulandice/blob/main/src/emulandice2/cli.py (ais command).

module_name: "emulandice2-glaciers"
container_image: "ghcr.io/fact-sealevel/emulandice2:edge"
uses_climate_file: true 
climate_file_required: true 
command: "main"
input_dir_name: "emulandice2"
#Argument specifications 
arguments:
  top_level:
    - name: "pipeline-id"
      type: "str"
      source: "metadata.pipeline-id"
      optional: true
      help: "Unique identifier for this instance of the module"
#    - name: "baseyear"
#      type: "int"
#      source: "metadata.baseyear"
#      optional: true
#      help: "Base year to which projections should be referenced"
    - name: "location-file"
      type: "str"
      source: "metadata.location-file"
      optional: true
      help: "File containing name, id, lat, and lon of points for localization"
      mount:
        container_path: "/mnt/shared_in"
    - name: "scenario"
      type: "str"
      source: "metadata.scenario"
      optional: false
      help: "SSP Emissions scenario."
    - name: "pyear-start"
      type: "int"
      source: "metadata.pyear-start"
      optional: true
      help: "Start year of the projection period."
    - name: "pyear-end"
      type: "int"
      source: "metadata.pyear-end"
      optional: true
      help: "End year of the projection period."
    - name: "pyear-step"
      type: "int"
      source: "metadata.pyear-step"
      optional: true
      help: "Step size for the projection period."
    - name: "baseyear"
      type: "int"
      source: "metadata.baseyear"
      optional: true
      help: "Base year to which projections should be referenced."
  options:
    - name: "ice-source"
      type: "str"
      source: "module_inputs.options.ice_source"
      optional: false
      default_value: "GLA"
      help: "For glaciers, ice source is always GLA"
    - name: "region"
      type: "str"
      source: "module_inputs.options.region"
      optional: false
      help: "Region within ice source to use." 
      default_value: "RGI01" 
      #allowed_values: ["RGI01", "RGI02", "RGI03", "RGI04", "RGI05", "RGI06", "RGI07", 
      #                 "RGI08", "RGI09", "RGI10", "RGI11", "RGI12", "RGI13", "RGI14", 
      #                 "RGI15", "RGI16", "RGI17", "RGI18", "RGI19"]
    - name: "chunksize"
      type: "int"
      source: "module_inputs.options.chunksize"
      optional: true
      help: "Size of each chunk to process."
    - name: "cyear-start"
      type: "int"
      source: "module_inputs.options.cyear_start"
      optional: true
      help: "Start year of the climate period."
    - name: "cyear-end"
      type: "int"
      source: "module_inputs.options.cyear_end"
      optional: true
      help: "End year of the climate period."
    - name: "no-rebase"
      type: "bool"
      source: "module_inputs.options.no_rebase"
      optional: true
      help: "Do not rebase samples to baseyear or regrid time."
    - name: "seed"
      type: "int"
      source: "module_inputs.options.seed"
      default_value: 2024
      help: "Random seed for reproducibility."
  fingerprint_params:
    - name: "grdfingerprintfile"
      type: "str"
      source: "module_inputs.fingerprint-params.grdfingerprintfile"
      #optional: true
      filename: "grd_fingerprintmap.yml"
      help: "File containing the grid fingerprint."
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
    - name: "fingerprint-dir"
      type: "str"
      source: "module_inputs.fingerprint-params.fingerprint_dir"
      #optional: true
      default_value: "FPRINT"
      help: "Directory containing the fingerprint files."
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
  inputs: 
    - name: "climate-data-file"
      type: "str"
      source: "module_inputs.inputs.climate_data_file"
      optional: false
      filename: "fair-temperature/climate.nc"
      help: "Fair output or tlm data"
      mount:
        volume: "output"
        container_path: "/mnt/out"
        transform: "filename"
    - name: "r-script-path"
      type: "str"
      source: "module_inputs.inputs.r_script_path"
      optional: true
      help: "Path to R script to launch emulandice2."
    - name: "emu-file"
      type: "str"
      source: "module_inputs.inputs.emu_file"
      optional: false
      help: "Path to the emulandice2 build file."
      #filename_map:
      #  region:
      #    RGI01: GLA_RGI01_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
      #    RGI02: GLA_RGI02_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI03: GLA_RGI03_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
      #    RGI04: GLA_RGI04_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
      #    RGI05: GLA_RGI05_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
       #   RGI06: GLA_RGI06_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
       #   RGI07: GLA_RGI07_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
       #   RGI08: GLA_RGI08_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
       #   RGI09: GLA_RGI09_GloGEM_OGGM_GO_pow_exp_10_EMULATOR.RData
      #    RGI10: GLA_RGI10_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI11: GLA_RGI11_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI12: GLA_RGI12_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI13: GLA_RGI13_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI14: GLA_RGI14_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI15: GLA_RGI15_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI16: GLA_RGI16_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI17: GLA_RGI17_GloGEM_OGGM_GO_pow_exp_10_EMULATOR.RData
      #    RGI18: GLA_RGI18_GloGEM_OGGM_GO_pow_exp_20_EMULATOR.RData
      #    RGI19: GLA_RGI19_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData
      filename: "emu_file/GLA_RGI01_GloGEM_OGGM_GO_pow_exp_01_EMULATOR.RData"
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
  outputs:
    files:
      - name: "output-gslr-file"
        type: "str"
        source: "module_inputs.outputs.output_gslr_file"
        optional: true
        help: "Path to the output GSLR file."
        output_type: "global"
        filename: "output-gslr-GLAC-ALL.nc"
        filename_map:
          region:
            RGI01: "output-gslr-GLAC-RGI01.nc"
            RGI02: "output-gslr-GLAC-RGI02.nc"
            RGI03: "output-gslr-GLAC-RGI03.nc"
            RGI04: "output-gslr-GLAC-RGI04.nc"
            RGI05: "output-gslr-GLAC-RGI05.nc"
            RGI06: "output-gslr-GLAC-RGI06.nc"
            RGI07: "output-gslr-GLAC-RGI07.nc"
            RGI08: "output-gslr-GLAC-RGI08.nc"
            RGI09: "output-gslr-GLAC-RGI09.nc"
            RGI10: "output-gslr-GLAC-RGI10.nc"
            RGI11: "output-gslr-GLAC-RGI11.nc"
            RGI12: "output-gslr-GLAC-RGI12.nc"
            RGI13: "output-gslr-GLAC-RGI13.nc"
            RGI14: "output-gslr-GLAC-RGI14.nc"
            RGI15: "output-gslr-GLAC-RGI15.nc"
            RGI16: "output-gslr-GLAC-RGI16.nc"
            RGI17: "output-gslr-GLAC-RGI17.nc"
            RGI18: "output-gslr-GLAC-RGI18.nc"
            RGI19: "output-gslr-GLAC-RGI19.nc"
        mount:
          volume: "output"
          container_path: "/mnt/out"
          transform: "filename"
      - name: "output-lslr-file"
        type: "str"
        source: "module_inputs.outputs.output_lslr_file"
        optional: true
        help: "Path to the output LSLR file."
        output_type: "local"
        filename: "output-lslr-GLAC-ALL.nc"
        filename_map:
          region:
            RGI01: "output-lslr-GLAC-RGI01.nc"
            RGI02: "output-lslr-GLAC-RGI02.nc"
            RGI03: "output-lslr-GLAC-RGI03.nc"
            RGI04: "output-lslr-GLAC-RGI04.nc"
            RGI05: "output-lslr-GLAC-RGI05.nc"
            RGI06: "output-lslr-GLAC-RGI06.nc"
            RGI07: "output-lslr-GLAC-RGI07.nc"
            RGI08: "output-lslr-GLAC-RGI08.nc"
            RGI09: "output-lslr-GLAC-RGI09.nc"
            RGI10: "output-lslr-GLAC-RGI10.nc"
            RGI11: "output-lslr-GLAC-RGI11.nc"
            RGI12: "output-lslr-GLAC-RGI12.nc"
            RGI13: "output-lslr-GLAC-RGI13.nc"
            RGI14: "output-lslr-GLAC-RGI14.nc"
            RGI15: "output-lslr-GLAC-RGI15.nc"
            RGI16: "output-lslr-GLAC-RGI16.nc"
            RGI17: "output-lslr-GLAC-RGI17.nc"
            RGI18: "output-lslr-GLAC-RGI18.nc"
            RGI19: "output-lslr-GLAC-RGI19.nc"
        mount:
          volume: "output"
          container_path: "/mnt/out"
          transform: "filename"
# Volume specifications
volumes:
  module_specific_input:
    host_path: "module_inputs.input_paths.module_specific_input_dir"
    help: "Module-specific input directory"
    container_path: "/mnt/module_specific_in"
  shared_input:
    host_path: "module_inputs.input_paths.shared_input_dir"
    help: "Shared input directory (fingerprints, location file)"
    container_path: "/mnt/shared_in"
  output:
    host_path: "module_inputs.output_paths.output_dir"
    help: "Output directory for SLR files"
    container_path: "/mnt/out"
