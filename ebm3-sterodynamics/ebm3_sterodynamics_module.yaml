# EBM3-STERODYNAMICS MODULE CONFIGURATION
# This YAML file describes the arguments and configuration needed to run the EBM3-Sterodynamics module.
# It is used to generate ModuleSchema objects in the facts-experiment-builder (FEB) package.
# Based on https://github.com/fact-sealevel/ebm3-sterodynamics/blob/main/src/ebm3_sterodynamics/cli.py.

# Input data archive: 
# https://zenodo.org/records/16024082/files/tlm_sterodynamics_cmip6_ebm3_data.tgz
# https://zenodo.org/records/11506798/files/ebm3_thermal_expansion_data.tgz

module_name: "ebm3-sterodynamics"
container_image: "ghcr.io/fact-sealevel/ebm3-sterodynamics:0.1.1"
uses_climate_file: true
climate_file_required: true
command: "main"

# Argument specifications
arguments:
  top_level:
    - name: "scenario"
      type: "str"
      source: "metadata.scenario"
      optional: false
      help: "SSP scenario (ie. 'ssp585')"
    - name: "nsamps"
      type: "int"
      source: "metadata.nsamps"
      optional: false
      help: "Number of samples to generate"
    - name: "pyear-start" #need to add condition for min value = 2020
      type: "int"
      source: "metadata.pyear_start"
      optional: false
      help: "Start year for the projection period"
    - name: "pyear-end" #need to add condition for max value = 2300
      type: "int"
      source: "metadata.pyear_end"
      optional: false
      help: "End year for the projection period"
    - name: "pyear-step"
      type: "int"
      source: "metadata.pyear_step"
      optional: false
      help: "Year step for the projection period"
    - name: "baseyear"
      type: "int"
      source: "metadata.baseyear"
      optional: false
      help: "Year to which projections are referenced"
    - name: "location-file"
      type: "str"
      source: "metadata.location-file"
      optional: true
      help: "File containing name, id, lat, and lon of points for localization"
      transform: "filename"
      mount:
        container_path: "/mnt/shared_in"
        volume: "input"
    - name: "pipeline-id"
      type: "str"
      source: "metadata.pipeline-id"
      optional: true
      help: "Pipeline ID"
    
  #Module-specific options
  options:
    - name: "seed"
      type: "int"
      source: "module_inputs.options.seed"
      default_value: 1234
      optional: false
      help: "Seed value for random number generator"
  
  # Input file arguments
  inputs:
    - name: "climate-data-file"
      type: "file"
      source: "module_inputs.inputs.climate_data_file"
      help: "NetCDF4/HDF5 file containing surface air temperature data"
      climate_output_type: "output-climate-file"
      mount:
        volume: "output" # Implicit dependency: needs fair output
        container_path: "/mnt/out"
        transform: "filename"
      external_volume: true
    - name: "rfmip"
      type: "file"
      source: "module_inputs.inputs.rfmip"
      help: "rfmip CSV file"
      filename: "ebm3_project_data/rfmip-radiative-forcing-annual-means-v4-0-0.csv"
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
    - name: "oceandynamics-params-file"
      type: "file"
      source: "module_inputs.inputs.oceandynamics_params_file"
      help: "CMIP6 params csv"
      filename: "ebm3_project_data/4xCO2_cummins_ebm3_cmip6.csv"
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
    - name: "zosdir"
      type: "dir"
      source: "module_inputs.inputs.zosdir"
      help: "Path to CMIP6 ZOS directory"
      default_value: "cmip6/zos/"
      mount: 
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
    - name: "thermal-expansion-params-file"
      type: "file"
      source: "module_inputs.inputs.thermal_expansion_params_file"
      help: "Full path to the calibrated constrains params file"
      filename: "ebm3_project_data/calibrated_constrained_parameters.csv"
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
    - name: "coef-file"
      type: "file"
      source: "module_inputs.inputs.coef_file"
      help: "Full path to expansion coefficient file"
      filename: "ebm3_project_data/scmpy3LM_RCMIP_CMIP6calpm_n18_expcoefs.nc"
      mount:
        volume: "module_specific_in"
        container_path: "/mnt/module_specific_in"
  # Output file arguments
  outputs: 
    files:
      - name: "output-gslr-file"
        type: "file"
        source: "module_inputs.outputs.output_gslr_file"
        filename: "gslr.nc"
        help: "Path to output global sea-level rise file"
        output_type: "global"
        pass_to_total: true
        mount:
          volume: "output"
          container_path: "/mnt/out"
          transform: "filename"
      - name: "output-lslr-file"
        type: "file"
        source: "module_inputs.outputs.output_lslr_file"
        filename: "lslr.nc"
        help: "Path to output local sea-level rise file"
        output_type: "local"
        pass_to_total: true
        mount:
          volume: "output"
          container_path: "/mnt/out"
          transform: "filename"
      - name: "output-lslr-quantile-file"
        type: "file"
        source: "module_inputs.outputs.output_lslr_quantile_file"
        filename: "lslr_quantiles.nc"
        help: "Path to output local sea-level rise quantiles file"
        output_type: "local"
        pass_to_total: false
        mount:
          volume: "output"
          container_path: "/mnt/out"
          transform: "filename"
      
# Volume specifications
volumes:
  module_specific_input:
    host_path: "module_inputs.input_paths.module_specific_input_dir"
    help: "Module-specific input directory"
    container_path: "/mnt/module_specific_in"
  shared_input:
    host_path: "module_inputs.input_paths.shared_input_dir"
    help: "TODO ADD HELP TEXT"
    container_path: "/mnt/shared_in"
  output:
    host_path: "module_inputs.output_paths.output_dir"
    help: "TODO ADD HELP TEXT"
    container_path: "/mnt/out"